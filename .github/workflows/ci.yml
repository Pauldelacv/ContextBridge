name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector is not optional: the tests exercise real HNSW search.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: contextbridge
          POSTGRES_PASSWORD: contextbridge
          POSTGRES_DB: contextbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextbridge -d contextbridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://contextbridge:contextbridge@localhost:5432/contextbridge_test
      DATABASE_URL: postgres://contextbridge:contextbridge@localhost:5432/contextbridge_test
      SESSION_SECRET: ci-session-secret-that-is-long-enough-000000
      CREDENTIAL_SECRET: ci-credential-secret-that-is-long-enough-00
      # No API keys in CI: the local embedding provider runs the full
      # ingestion and retrieval path offline.
      EMBEDDING_PROVIDER: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate test database
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
