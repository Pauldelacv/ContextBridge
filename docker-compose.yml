services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contextbridge-postgres
    environment:
      POSTGRES_USER: contextbridge
      POSTGRES_PASSWORD: contextbridge
      POSTGRES_DB: contextbridge
    ports:
      - "5432:5432"
    volumes:
      - contextbridge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextbridge -d contextbridge"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  contextbridge-pgdata:
